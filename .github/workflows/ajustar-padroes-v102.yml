name: Ajustar padrões DUN-14 v1.0.2
on:
  push:
    paths:
      - .github/workflows/ajustar-padroes-v102.yml
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar ajustes mínimos e verificar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          assert 'versão de teste 1.0.1' in s
          s=s.replace('versão de teste 1.0.1','versão de teste 1.0.2',1)
          start=s.index('<label for="size">Tamanho da etiqueta</label>')
          end=s.index('<label for="quantity">Quantidade de etiquetas</label>',start)
          old=s[start:end]
          assert '<select id="size">' in old and '<input id="barcode-offset"' in old
          old=old.replace('<select id="size"><option value="33x21">','<select id="size"><option value="33x21">',1)
          old=old.replace('<option value="40x30">','<option value="40x30" selected>',1)
          old=old.replace('step="0.5" value="2"','step="0.5" value="6"',1)
          assert 'value="40x30" selected' in old and 'step="0.5" value="6"' in old
          replacement='<details class="print-options"><summary>Tamanho da etiqueta e ajuste horizontal</summary><div class="print-options-fields">'+old+'</div></details>'
          s=s[:start]+replacement+s[end:]
          s=s.replace('</style></head>','details.print-options{margin-top:16px;border:1px solid #d6e0e7;border-radius:8px;padding:10px 12px}details.print-options summary{cursor:pointer;font-weight:bold;color:#254d69}details.print-options .print-options-fields{padding-top:3px}details.print-options label:first-child{margin-top:12px}@media print{details.print-options{display:none!important}}</style></head>',1)
          assert s.count('<details class="print-options">')==1
          assert '<details class="print-options" open' not in s
          p.write_text(s)
          sw=Path('sw.js'); t=sw.read_text(); assert "dun14-v2.0.0" in t;sw.write_text(t.replace('dun14-v2.0.0','dun14-v1.0.2',1))
          print('OK: 40x30, 6 mm, opções fechadas e versão 1.0.2')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --check
          git commit -m "fix: opções de impressão recolhíveis e padrões 40x30/6mm v1.0.2"
          git push